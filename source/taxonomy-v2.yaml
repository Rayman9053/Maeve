# Startup Opportunity Map: canonical taxonomy (single source of truth).
#
# Edit THIS file, then run:  python3 scripts/validate.py && python3 scripts/build.py
# Never edit files in output/ by hand.
#
# Node schema
#   name:     required, 1-4 words (excluding "&"), unique among siblings
#   note:     optional short note: scope, caveats, brand examples (as of 2026)
#   tags:     optional list from: trending, underserved, regulated, b2b, consumer, ai-native
#             A tag covers the node's whole subtree, so descendants never repeat it.
#   see:      optional list of exact paths ("Pillar > Category > ...") to a node that lives
#             elsewhere. This is the cross-reference for a topic that is kept once.
#   children: optional list of nodes
#
# Levels: Pillar > Category > Subcategory > Leaf (max depth 4). Every non-leaf has 3-8 children.

